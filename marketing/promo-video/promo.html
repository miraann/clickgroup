function scaled(lw, sw, sh, inner) {           // app UIs are laid out at a logical width, then scaled into the screen
  const s = sw / lw;
  return `<div class="lgc" style="width:${lw}px;height:${(sh / s).toFixed(1)}px;transform:scale(${s.toFixed(5)})">${inner}</div>`;
}
function phone(id, x, y, w, h, inner, { lw = 0, bg = '#fff' } = {}) {
  const r = Math.round(w * .16), b = Math.max(6, Math.round(w * .042));
  const sw = w - 2 * b, sh = h - 2 * b;
  return `<div class="dev" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="phF" style="border-radius:${r}px"></div>
    <div class="phS" style="left:${b}px;top:${b}px;width:${sw}px;height:${sh}px;border-radius:${r - b + 1}px;background:${bg}">
      ${lw ? scaled(lw, sw, sh, inner) : inner}
      <div class="isl" style="top:${Math.round(w * .028)}px;height:${Math.round(w * .068)}px;border-radius:${Math.round(w * .04)}px"></div>
    </div></div>`;
}
function tablet(id, x, y, w, h, inner, lw) {
  const b = 10, sw = w - 2 * b, sh = h - 2 * b;
  return `<div class="dev" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="tbF"></div>
    <div class="phS" style="left:${b}px;top:${b}px;width:${sw}px;height:${sh}px;border-radius:12px">${scaled(lw, sw, sh, inner)}</div></div>`;
}
function monitor(id, x, y, w, h, inner, lw) {
  const b = 9, sw = w - 2 * b, sh = h - 2 * b;
  return `<div class="dev" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="mnNeck" style="left:${w / 2 - 24}px;top:${h - 4}px"></div><div class="mnFoot" style="left:${w / 2 - 75}px;top:${h + 32}px"></div>
    <div class="mnF"></div>
    <div class="phS" style="left:${b}px;top:${b}px;width:${sw}px;height:${sh}px;border-radius:4px">${scaled(lw, sw, sh, inner)}</div></div>`;
}

const pnf = (id, logo, t, b) => `<div class="pnf" id="${id}"><div class="pnL">${logo}</div><div style="min-width:0"><div class="pnT">${t}</div><div class="pnB">${b}</div></div><span class="pnN">ئێستا</span></div>`;

// ─────────────────────────────────────────────────────────────────────────────
//  Taps + sound cues
// ─────────────────────────────────────────────────────────────────────────────
const TAPS = [
  { t: T.book + 1.2, id: 'bkDay' + SEL_DAY }, { t: T.book + 2.0, id: 'bkSlot' + SEL_SLOT }, { t: T.book + 2.5, id: 'bkCta' },
  { t: T.book + 6.0, id: 'nfOk' },
  { t: T.rest + 1.0, id: 'qmAdd0' }, { t: T.rest + 1.45, id: 'qmAdd2' }, { t: T.rest + 1.85, id: 'qmSend' },
  { t: T.rest + RS_WIN[1] + .75, id: 'posT1' }, { t: T.rest + RS_WIN[1] + 1.05, id: 'posT5' }, { t: T.rest + RS_WIN[1] + 1.4, id: 'posPay' },
];
const SFX = [];
const sfx = (name, t, vol = 1) => SFX.push({ name, t: +t.toFixed(3), vol });
function buildSfx() {
  sfx('shimmer', .15, .5);
  HK1.forEach((c, i) => { if (c !== ' ') sfx('type', .4 + 1.05 * (i + .5) / HK1.length, .55); });
  sfx('pop', 1.9, .7); sfx('sparkle', 2.4, .7); sfx('riser', 2.6, .8); sfx('whoosh', 3.45, .6);

  sfx('impact', T.logo, 1); sfx('pop', T.logo + .3, .7); sfx('chime', T.logo + .68, .8); sfx('shimmer', T.logo + 1.3, .5); sfx('whoosh', T.logo + 3.35, .6);

  sfx('whoosh', T.svc + .05, .5);
  for (let i = 0; i < 4; i++) sfx('pop', T.svc + .55 + i * .3, .7);
  for (let i = 0; i < 4; i++) sfx('blip', T.svc + 2.25 + i * .4, .5);
  sfx('swipe', T.svc + 3.9, .6); sfx('whoosh', T.web - .5, .6);

  sfx('whoosh', T.web + .1, .7); sfx('swipe', T.web + .45, .6); sfx('pop', T.web + .7, .7);
  [.9, 3.0, 5.0].forEach(d => sfx('blip', T.web + d, .45));
  sfx('pop', T.web + 3.0, .7); sfx('swipe', T.web + 3.6, .5); sfx('chime', T.web + 4.2, .7);
  sfx('swipe', T.web + 5.0, .6); sfx('sparkle', T.web + 5.4, .5); sfx('whoosh', T.book - .5, .6);

  sfx('whoosh', T.book + .1, .7); sfx('pop', T.book + .6, .7);
  [.9, 2.9, 5.0].forEach(d => sfx('blip', T.book + d, .45));
  sfx('swipe', T.book + 2.9, .55);
  for (let i = 0; i < 12; i++) sfx('tick', T.book + 3.25 + i * .05, .4);
  sfx('lock', T.book + 4.15, .9); sfx('swipe', T.book + 4.6, .5); sfx('chime', T.book + 4.9, .7);
  sfx('notif', T.book + 5.2, 1); sfx('success', T.book + 6.3, .9); sfx('whoosh', T.rest - .5, .6);

  sfx('whoosh', T.rest + .1, .7); sfx('pop', T.rest + 1.1, .6); sfx('chime', T.rest + 1.95, .7);
  RS_WIN.slice(1).forEach(d => sfx('swipe', T.rest + d - .2, .6));
  sfx('cash', T.rest + RS_WIN[1] + 1.45, .9); sfx('notif', T.rest + RS_WIN[2] + .6, .8); sfx('chime', T.rest + RS_WIN[2] + 1.2, .7);
  sfx('blip', T.rest + RS_WIN[3] + .4, .4); sfx('sparkle', T.rest + RS_WIN[4] + .45, .6); sfx('whoosh', T.apps - .5, .6);

  sfx('whoosh', T.apps + .1, .7); sfx('swipe', T.apps + .45, .5);
  [1.2, 1.7, 2.2].forEach(d => sfx('notif', T.apps + d, .75));
  sfx('pop', T.apps + 2.8, .7); sfx('pop', T.apps + 3.1, .7); sfx('whoosh', T.stats - .5, .6);

  sfx('whoosh', T.stats + .05, .6);
  [0, 1, 2].forEach(k => sfx('pop', T.stats + .35 + k * .15, .6));
  for (let i = 0; i < 14; i++) sfx('tick', T.stats + .5 + i * .075, .35);
  sfx('sparkle', T.stats + 1.9, .6);

  sfx('impact', T.cta, 1); sfx('shimmer', T.cta + .2, .6);
  ORBIT.forEach((_, k) => sfx('pop', T.cta + .45 + k * .12, .5));
  sfx('pop', T.cta + .9, .8); sfx('sparkle', T.cta + 1.0, .7);
  TAPS.forEach(tp => sfx('tap', tp.t, .9));
  SFX.sort((x, y) => x.t - y.t);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Per-frame update
// ─────────────────────────────────────────────────────────────────────────────
function seek(t) {
  bgU(t); rainU(t); hookU(t); logoU(t); svcU(t); webU(t); bookU(t); restU(t); appsU(t); statsU(t); ctaU(t); bugU(t); tapU(t);
  vis('fade', Math.max(1 - P(t, 0, .3, E.lin), P(t, DUR - .6, .6, E.io)));
}

function bgU(t) {
  $('bgGrid').style.backgroundPosition = `${(-t * 8).toFixed(1)}px ${(t * 8).toFixed(1)}px`;

    const p = P(t, a + d, .55, id === 'ctPh' ? E.back : E.out);
    vis(id, Math.min(1, p * 1.4));
    tf(id, `translateY(${((1 - p) * 22).toFixed(2)}px)` + (id === 'ctPh' ? ` scale(${((.85 + .15 * p) * (1 + .025 * Math.sin((t - a) * 3.2) * P(t, a + 1.6, .5))).toFixed(4)})` : ''));
  });
  const sh = ((t - a - 1.6) % 2.4) / .8;
  tf('ctShine', `translateX(${(t > a + 1.6 && sh < 1 ? lerp(-80, 460, sh) : -200).toFixed(1)}px) skewX(-20deg)`);
}

function bugU(t) {
  vis('bug', Math.min(P(t, T.svc - .15, .3), 1 - P(t, T.cta - .4, .3, E.in)));
}

function tapU(t) {
  const tp = TAPS.find(x => t >= x.t - .35 && t <= x.t + .4);
  if (!tp) { vis('tap', 0); return; }
  const r = $(tp.id).getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const pre = P(t, tp.t - .35, .3), post = P(t, tp.t, .4), press = bump(t, tp.t, .1);
  vis('tap', pre * (1 - P(t, tp.t + .2, .2)));
  tf('tap', `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(LAY.vzS * (1.25 - .25 * pre - .15 * press)).toFixed(4)})`);
  vis('tapRip', post > 0 ? 1 - post : 0); tf('tapRip', `scale(${1 + post * 1.3})`);
}

// shrink single-line text until it fits (layout width, so zone scaling doesn't matter)
function fit(el, max) {
  const s = document.createElement('span');
  s.style.display = 'inline-block'; s.style.whiteSpace = 'nowrap';
  while (el.firstChild) s.appendChild(el.firstChild);
  el.appendChild(s);
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (s.offsetWidth > max && fs > 14) { fs -= .5; el.style.fontSize = fs + 'px'; }
}
function fitAll() {
  document.querySelectorAll('.ttl,.hookL,.tag').forEach(e => fit(e, 490));
  document.querySelectorAll('.sub').forEach(e => { e.style.whiteSpace = 'nowrap'; fit(e, 470); });
  document.querySelectorAll('.chip').forEach(e => {
    let fs = parseFloat(getComputedStyle(e).fontSize);
    while (e.offsetWidth > 500 && fs > 12) { fs -= .5; e.style.fontSize = fs + 'px'; }
  });
}

function init() { build(); fitAll(); buildSfx(); seek(0); }

// Browser preview: promo.html?play (loops) · promo.html?t=31.5 (one frame) · add &f=45 for the feed cut
if (Q.has('play') || Q.has('t')) {
  document.fonts.load('20px KU').then(() => {
    init();
    if (Q.has('t')) { seek(+Q.get('t')); return; }
    const t0 = performance.now();
    (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
  });
}
</script>
